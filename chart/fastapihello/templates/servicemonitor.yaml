apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fastapihello
  namespace: '{{ .Release.Namespace }}'
  labels:
    app: fastapihello
    app.kubernetes.io/name: fastapihello
    app.kubernetes.io/vendor: kubesphere
spec:
  selector:
    matchLabels:
      app: fastapihello
  namespaceSelector:
    matchNames:
      - '{{ .Release.Namespace }}'
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      scheme: http
