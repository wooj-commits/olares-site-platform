apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapihello
  namespace: '{{ .Release.Namespace }}'
  labels:
    app: fastapihello
spec:
  replicas: {{ .Values.workloads.fastapihello.replicaCount }}
  selector:
    matchLabels:
      app: fastapihello
  template:
    metadata:
      labels:
        app: fastapihello
    spec:
      automountServiceAccountToken: false
      containers:
      - name: fastapihello
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.port }}
        env:
        - name: PORT
          value: {{ .Values.port | quote }}
        resources:
          requests:
            cpu: {{ .Values.resources.requests.cpu | quote }}
            memory: {{ .Values.resources.requests.memory | quote }}
          limits:
            cpu: {{ .Values.resources.limits.cpu | quote }}
            memory: {{ .Values.resources.limits.memory | quote }}
        readinessProbe:
          httpGet:
            path: {{ .Values.healthPath }}
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: {{ .Values.healthPath }}
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: fastapihello
  namespace: '{{ .Release.Namespace }}'
spec:
  selector:
    app: fastapihello
  ports:
  - name: http
    port: {{ .Values.port }}
    targetPort: {{ .Values.port }}
