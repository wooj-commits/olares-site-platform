olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

metadata:
  name: SITE_NAME
  appid: SITE_NAME
  title: SITE_TITLE
  description: SITE_DESCRIPTION
  icon: https://app.cdn.olares.com/appstore/default/defaulticon.webp
  version: 0.1.1
  categories:
  - Developer Tools
  - Productivity_v112

entrances:
- name: web
  host: SITE_NAME
  port: 3000
  title: SITE_TITLE
  icon: https://app.cdn.olares.com/appstore/default/defaulticon.webp
  authLevel: public
  visible: true
  openMethod: window

permission:
  appData: true

spec:
  versionName: '0.1.1'
  fullDescription: |
    SITE_DESCRIPTION

    From chart/site-template in wooj-commits/olares-site-platform.
    Replace SITE_* placeholders. Optional Postgres middleware and bundled MinIO
    are toggled in values.yaml + this manifest. AUTH_SECRET is auto-generated.
  developer: SITE_DEVELOPER
  website: https://github.com/OWNER/REPO
  sourceCode: https://github.com/OWNER/REPO
  submitter: SITE_DEVELOPER
  locale:
  - en-US
  license:
  - text: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  supportArch:
  - amd64
  accelerator:
  - mode: cpu
    requiredCpu: 100m
    limitedCpu: "1"
    requiredMemory: 256Mi
    limitedMemory: 1Gi
    requiredDisk: 256Mi
    limitedDisk: 10Gi

options:
  apiTimeout: 0
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.7-0'

# System Postgres (always available). Remove this block for static-only sites.
middleware:
  postgres:
    username: SITE_NAME
    databases:
    - name: SITE_NAME

workloadReplicas:
  SITE_NAME: 1
  minio: 1

envs:
- envName: BETTER_AUTH_URL
  required: false
  type: string
  editable: true
  applyOnChange: true
  default: ""
  description: Optional public HTTPS base URL override (auth-capable apps).
