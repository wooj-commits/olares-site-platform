olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

metadata:
  name: SITE_NAME
  appid: SITE_NAME
  title: SITE_TITLE
  description: SITE_DESCRIPTION
  icon: https://app.cdn.olares.com/appstore/default/defaulticon.webp
  version: 0.1.0
  categories:
  - Developer Tools
  - Productivity_v112

entrances:
- name: web
  host: SITE_NAME
  port: 3000
  title: SITE_TITLE
  icon: https://app.cdn.olares.com/appstore/default/defaulticon.webp
  authLevel: public
  visible: true
  openMethod: window

permission:
  appData: true

spec:
  versionName: '0.1.0'
  fullDescription: |
    SITE_DESCRIPTION

    Generated from chart/site-template in wooj-commits/olares-site-platform.
    Replace SITE_* placeholders before packaging.
  developer: SITE_DEVELOPER
  website: https://github.com/OWNER/REPO
  sourceCode: https://github.com/OWNER/REPO
  submitter: SITE_DEVELOPER
  locale:
  - en-US
  license:
  - text: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  supportArch:
  - amd64
  accelerator:
  - mode: cpu
    requiredCpu: 250m
    limitedCpu: "2"
    requiredMemory: 512Mi
    limitedMemory: 2Gi
    requiredDisk: 256Mi
    limitedDisk: 5Gi

options:
  apiTimeout: 0
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.7-0'
  - name: postgres
    type: middleware
    version: '>=1.0.0-0'
    mandatory: true
  - name: minio
    type: middleware
    version: '>=1.0.0-0'
    mandatory: true

middleware:
  postgres:
    username: SITE_NAME
    databases:
    - name: SITE_NAME
  minio:
    username: SITE_NAME
    buckets:
    - name: SITE_NAME

workloadReplicas:
  SITE_NAME: 1

envs:
- envName: AUTH_SECRET
  required: true
  type: password
  editable: true
  applyOnChange: true
  description: Better Auth signing secret (32+ random chars).
- envName: BETTER_AUTH_URL
  required: true
  type: string
  editable: true
  applyOnChange: true
  default: "https://web.SITE_NAME.OLARES_ID.olares.com"
  description: Public HTTPS base URL of this entrance (no trailing slash).
- envName: GOOGLE_CLIENT_ID
  required: false
  type: string
  editable: true
  applyOnChange: true
  default: ""
  description: Optional Google OAuth client id.
- envName: GOOGLE_CLIENT_SECRET
  required: false
  type: password
  editable: true
  applyOnChange: true
  description: Optional Google OAuth client secret.
- envName: GITHUB_CLIENT_ID
  required: false
  type: string
  editable: true
  applyOnChange: true
  default: ""
  description: Optional GitHub OAuth client id.
- envName: GITHUB_CLIENT_SECRET
  required: false
  type: password
  editable: true
  applyOnChange: true
  description: Optional GitHub OAuth client secret.
