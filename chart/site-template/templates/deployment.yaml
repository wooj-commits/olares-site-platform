{{- $app := "SITE_NAME" -}}
{{- $port := .Values.port | default 3000 | int -}}
{{- $health := .Values.healthPath | default "/api/health" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $app }}
  namespace: '{{ .Release.Namespace }}'
  labels:
    app: {{ $app }}
spec:
  replicas: {{ index .Values.workloads $app | default dict | dig "replicaCount" 1 }}
  selector:
    matchLabels:
      app: {{ $app }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: {{ $app }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ $port }}"
        prometheus.io/path: "/metrics"
    spec:
      automountServiceAccountToken: false
      containers:
      - name: {{ $app }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ $port }}
          protocol: TCP
        env:
        - name: PORT
          value: {{ $port | quote }}
        - name: HOSTNAME
          value: "0.0.0.0"
        - name: BETTER_AUTH_URL
          value: {{ include "site.betterAuthURL" . | quote }}
        {{- range $k, $v := .Values.env }}
        - name: {{ $k }}
          value: {{ $v | quote }}
        {{- end }}
        {{- if .Values.storage.enabled }}
        - name: MINIO_ENDPOINT
          value: {{ .Values.storage.endpoint | quote }}
        - name: MINIO_BUCKET
          value: {{ .Values.storage.bucket | quote }}
        - name: MINIO_USE_SSL
          value: {{ .Values.storage.useSSL | quote }}
        - name: MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-app
              key: MINIO_ACCESS_KEY
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-app
              key: MINIO_SECRET_KEY
        {{- end }}
        - name: AUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-app
              key: AUTH_SECRET
        {{- if and .Values.postgres.enabled .Values.postgres.host }}
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-app
              key: DATABASE_URL
        {{- end }}
        resources:
          requests:
            cpu: {{ .Values.resources.requests.cpu | quote }}
            memory: {{ .Values.resources.requests.memory | quote }}
          limits:
            cpu: {{ .Values.resources.limits.cpu | quote }}
            memory: {{ .Values.resources.limits.memory | quote }}
        readinessProbe:
          httpGet:
            path: {{ $health | quote }}
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: {{ $health | quote }}
            port: http
          initialDelaySeconds: 30
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $app }}
  namespace: '{{ .Release.Namespace }}'
  labels:
    app: {{ $app }}
    app.kubernetes.io/name: {{ $app }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "{{ $port }}"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app: {{ $app }}
  ports:
  - name: http
    port: {{ $port }}
    targetPort: {{ $port }}
