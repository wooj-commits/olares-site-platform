apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-app
  namespace: '{{ .Release.Namespace }}'
type: Opaque
stringData:
  AUTH_SECRET: {{ index (.Values.olaresEnv | default dict) "AUTH_SECRET" | default "" | quote }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s:%v/%s" .Values.postgres.username .Values.postgres.password .Values.postgres.host .Values.postgres.port .Values.postgres.databases.SITE_NAME | quote }}
  MINIO_ACCESS_KEY: {{ .Values.minio.username | quote }}
  MINIO_SECRET_KEY: {{ .Values.minio.password | quote }}
  {{- with index (.Values.olaresEnv | default dict) "GOOGLE_CLIENT_SECRET" }}
  GOOGLE_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
  {{- with index (.Values.olaresEnv | default dict) "GITHUB_CLIENT_SECRET" }}
  GITHUB_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
