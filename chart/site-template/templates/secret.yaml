apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-app
  namespace: '{{ .Release.Namespace }}'
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  AUTH_SECRET: {{ include "site.authSecret" . | b64enc | quote }}
  {{- if .Values.storage.enabled }}
  MINIO_ACCESS_KEY: {{ .Values.storage.accessKey | b64enc | quote }}
  MINIO_SECRET_KEY: {{ include "site.minioPassword" . | b64enc | quote }}
  {{- end }}
  {{- if and .Values.postgres.enabled .Values.postgres }}
  {{- if .Values.postgres.host }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s:%v/%s" .Values.postgres.username .Values.postgres.password .Values.postgres.host .Values.postgres.port (index .Values.postgres.databases "SITE_NAME") | b64enc | quote }}
  {{- end }}
  {{- end }}
