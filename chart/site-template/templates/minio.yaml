{{- if .Values.storage.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: '{{ .Release.Namespace }}'
  labels:
    app: minio
spec:
  replicas: {{ .Values.workloads.minio.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: minio
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: minio
    spec:
      automountServiceAccountToken: false
      initContainers:
      - name: init-chmod-data
        image: docker.io/beclab/aboveos-busybox:1.37.0
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 0
        command: ["sh", "-ec", "mkdir -p /data && chown -R 1000:1000 /data"]
        volumeMounts:
        - name: minio-data
          mountPath: /data
      containers:
      - name: minio
        image: "{{ .Values.minioImage.repository }}:{{ .Values.minioImage.tag }}"
        imagePullPolicy: {{ .Values.minioImage.pullPolicy }}
        args: ["server", "--console-address", ":9001", "/data"]
        ports:
        - name: api
          containerPort: 9000
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-app
              key: MINIO_ACCESS_KEY
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-app
              key: MINIO_SECRET_KEY
        resources:
          requests:
            cpu: {{ .Values.minioResources.requests.cpu | quote }}
            memory: {{ .Values.minioResources.requests.memory | quote }}
          limits:
            cpu: {{ .Values.minioResources.limits.cpu | quote }}
            memory: {{ .Values.minioResources.limits.memory | quote }}
        readinessProbe:
          httpGet:
            path: /minio/health/ready
            port: api
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: minio-data
          mountPath: /data
      volumes:
      - name: minio-data
        hostPath:
          path: '{{ .Values.userspace.appData }}/minio'
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: '{{ .Release.Namespace }}'
spec:
  selector:
    app: minio
  ports:
  - name: api
    port: 9000
    targetPort: 9000
{{- end }}
