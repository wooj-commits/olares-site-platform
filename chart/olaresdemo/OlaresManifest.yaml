olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

metadata:
  name: olaresdemo
  appid: olaresdemo
  title: Olares Demo
  description: Native Olares site platform demo — Better Auth, Postgres CRUD, bundled MinIO uploads
  icon: https://app.cdn.olares.com/appstore/default/defaulticon.webp
  version: 0.1.9
  categories:
  - Developer Tools
  - Productivity_v112

entrances:
- name: web
  host: olaresdemo
  port: 3000
  title: Olares Demo
  icon: https://app.cdn.olares.com/appstore/default/defaulticon.webp
  authLevel: public
  visible: true
  openMethod: window

permission:
  appData: true

spec:
  versionName: '0.1.9'
  fullDescription: |
    Demo app for the reusable Olares site platform (wooj-commits/olares-site-platform).

    Stack: Next.js 15 single container, Better Auth (email/password; Google + GitHub OAuth
    wired but disabled until client credentials are set), system Postgres middleware for
    notes CRUD, and an in-chart MinIO (beclab/minio-minio on userspace appData) for uploads.
    AUTH_SECRET and MinIO credentials are generated at install and persist across upgrades.

    Public entrance on the default Olares URL. Base URL is derived from the request Host (allowedHosts *.woojinc1205.olares.com); BETTER_AUTH_URL is an optional
    host; override in Settings only if you change the public URL. Optional OAuth client
    IDs/secrets go in Settings when ready.
  developer: woojinc1205
  website: https://github.com/wooj-commits/olares-site-platform
  sourceCode: https://github.com/wooj-commits/olares-site-platform
  submitter: woojinc1205
  doc: https://github.com/wooj-commits/olares-site-platform/blob/main/docs/new-site-checklist.md
  locale:
  - en-US
  license:
  - text: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  supportArch:
  - amd64
  accelerator:
  - mode: cpu
    requiredCpu: 250m
    limitedCpu: "2"
    requiredMemory: 512Mi
    limitedMemory: 2Gi
    requiredDisk: 1Gi
    limitedDisk: 20Gi

options:
  apiTimeout: 0
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.7-0'

# System Postgres only — no Market middleware deps (postgres is always on;
# Market MinIO is broken on some mirrors, so object storage is bundled below).
middleware:
  postgres:
    username: olaresdemo
    databases:
    - name: olaresdemo

workloadReplicas:
  olaresdemo: 1
  minio: 1

envs:
- envName: BETTER_AUTH_URL
  required: false
  type: string
  editable: true
  applyOnChange: true
  default: ""
  description: Optional static fallback base URL only. Leave empty — the app derives https://<request-host> from Envoy headers.
- envName: GOOGLE_CLIENT_ID
  required: false
  type: string
  editable: true
  applyOnChange: true
  default: ""
  description: Optional. Enables Google OAuth when set with GOOGLE_CLIENT_SECRET.
- envName: GOOGLE_CLIENT_SECRET
  required: false
  type: password
  editable: true
  applyOnChange: true
  description: Optional Google OAuth client secret.
- envName: GITHUB_CLIENT_ID
  required: false
  type: string
  editable: true
  applyOnChange: true
  default: ""
  description: Optional. Enables GitHub OAuth when set with GITHUB_CLIENT_SECRET.
- envName: GITHUB_CLIENT_SECRET
  required: false
  type: password
  editable: true
  applyOnChange: true
  description: Optional GitHub OAuth client secret.
- envName: REDIRECT_RULES_JSON
  required: false
  type: string
  editable: true
  applyOnChange: true
  default: "[]"
  description: JSON array of {from_path,to_url,status} redirect rules (Site Console).
