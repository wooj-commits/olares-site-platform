apiVersion: apps/v1
kind: Deployment
metadata:
  name: olaresdemo
  namespace: '{{ .Release.Namespace }}'
  labels:
    app: olaresdemo
spec:
  replicas: {{ .Values.workloads.olaresdemo.replicaCount }}
  selector:
    matchLabels:
      app: olaresdemo
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: olaresdemo
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.env.PORT | quote }}
        prometheus.io/path: "/metrics"
    spec:
      automountServiceAccountToken: false
      containers:
      - name: olaresdemo
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.env.PORT | int }}
          protocol: TCP
        env:
        {{- $oe := .Values.olaresEnv | default dict }}
        - name: NODE_ENV
          value: {{ .Values.env.NODE_ENV | quote }}
        - name: PORT
          value: {{ .Values.env.PORT | quote }}
        - name: HOSTNAME
          value: "0.0.0.0"
        - name: BETTER_AUTH_ALLOWED_HOSTS
          value: "*.woojinc1205.olares.com,*.olares.com,localhost,localhost:3000"
        {{- with index $oe "BETTER_AUTH_URL" }}
        - name: BETTER_AUTH_URL
          value: {{ . | quote }}
        {{- end }}
        - name: GOOGLE_CLIENT_ID
          value: {{ index $oe "GOOGLE_CLIENT_ID" | default "" | quote }}
        - name: GITHUB_CLIENT_ID
          value: {{ index $oe "GITHUB_CLIENT_ID" | default "" | quote }}
        - name: MINIO_ENDPOINT
          value: "minio:9000"
        - name: MINIO_BUCKET
          value: {{ .Values.env.MINIO_BUCKET | quote }}
        - name: MINIO_USE_SSL
          value: {{ .Values.env.MINIO_USE_SSL | quote }}
        - name: AUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-app
              key: AUTH_SECRET
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-app
              key: DATABASE_URL
        - name: MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-app
              key: MINIO_ACCESS_KEY
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-app
              key: MINIO_SECRET_KEY
        - name: GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-app
              key: GOOGLE_CLIENT_SECRET
              optional: true
        - name: GITHUB_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-app
              key: GITHUB_CLIENT_SECRET
              optional: true
        {{- with index $oe "BACKUP_TOKEN" }}
        - name: BACKUP_TOKEN
          value: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            cpu: {{ .Values.resources.requests.cpu | quote }}
            memory: {{ .Values.resources.requests.memory | quote }}
          limits:
            cpu: {{ .Values.resources.limits.cpu | quote }}
            memory: {{ .Values.resources.limits.memory | quote }}
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: olaresdemo
  namespace: '{{ .Release.Namespace }}'
  labels:
    app: olaresdemo
    app.kubernetes.io/name: olaresdemo
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "{{ .Values.env.PORT }}"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app: olaresdemo
  ports:
  - name: http
    port: {{ .Values.env.PORT | int }}
    targetPort: {{ .Values.env.PORT | int }}
