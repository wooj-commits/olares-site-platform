apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-app
  namespace: '{{ .Release.Namespace }}'
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  AUTH_SECRET: {{ include "olaresdemo.authSecret" . | b64enc | quote }}
  MINIO_ACCESS_KEY: {{ .Values.env.MINIO_ACCESS_KEY | b64enc | quote }}
  MINIO_SECRET_KEY: {{ include "olaresdemo.minioPassword" . | b64enc | quote }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s:%v/%s" .Values.postgres.username .Values.postgres.password .Values.postgres.host .Values.postgres.port .Values.postgres.databases.olaresdemo | b64enc | quote }}
  {{- with index (.Values.olaresEnv | default dict) "GOOGLE_CLIENT_SECRET" }}
  GOOGLE_CLIENT_SECRET: {{ . | b64enc | quote }}
  {{- end }}
  {{- with index (.Values.olaresEnv | default dict) "GITHUB_CLIENT_SECRET" }}
  GITHUB_CLIENT_SECRET: {{ . | b64enc | quote }}
  {{- end }}
