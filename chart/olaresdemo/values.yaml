image:
  repository: ghcr.io/wooj-commits/olares-site-platform
  tag: "0.2.0"
  pullPolicy: IfNotPresent

minioImage:
  repository: docker.io/beclab/minio-minio
  tag: "RELEASE.2023-12-20T01-00-02Z"
  pullPolicy: IfNotPresent

workloads:
  olaresdemo:
    replicaCount: 1
  minio:
    replicaCount: 1

# Sums must match OlaresManifest accelerator required*/limited*:
# requests: 200m+50m=250m, 384Mi+128Mi=512Mi
# limits:   1500m+500m=2000m (2), 1536Mi+512Mi=2048Mi (2Gi)
resources:
  requests:
    cpu: 200m
    memory: 384Mi
  limits:
    cpu: "1500m"
    memory: 1536Mi

minioResources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

env:
  NODE_ENV: production
  PORT: "3000"
  MINIO_USE_SSL: "false"
  MINIO_BUCKET: olaresdemo
  MINIO_ACCESS_KEY: olaresdemo
