name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: meta
        run: |
          V=$(awk '/^version:/{print $2; exit}' chart/olaresdemo/Chart.yaml)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Using version $V"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/wooj-commits/olares-site-platform:${{ steps.meta.outputs.version }}
            ghcr.io/wooj-commits/olares-site-platform:latest
          labels: |
            org.opencontainers.image.source=https://github.com/wooj-commits/olares-site-platform
            org.opencontainers.image.description=Olares site platform demo (Next.js + Better Auth)
            org.opencontainers.image.licenses=Apache-2.0

      - name: Make package public
        continue-on-error: true
        run: |
          curl -sS -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/user/packages/container/olares-site-platform \
            -d '{"visibility":"public"}' || true

      - name: Install helm
        uses: azure/setup-helm@v4

      - name: Package chart
        run: |
          helm package chart/olaresdemo -d dist
          ls -la dist

      - name: Upload chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: olaresdemo-chart
          path: dist/*.tgz

      - name: Release chart tarball
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: v${{ steps.meta.outputs.version }}
          files: dist/*.tgz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
