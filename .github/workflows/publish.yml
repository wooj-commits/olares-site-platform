name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      app_path:
        description: "Optional path to build (default builds platform demos)"
        required: false
        default: ""

permissions:
  contents: write
  packages: write

jobs:
  # Language-agnostic image build: Dockerfile → else Nixpacks → else Buildpacks
  build-image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: olares-site-platform
            context: .
            dockerfile: Dockerfile
            version_file: chart/olaresdemo/Chart.yaml
          - name: olares-site-platform-fastapi
            context: apps/fastapi-hello
            dockerfile: Dockerfile
            version_file: chart/fastapihello/Chart.yaml
          - name: olares-site-console
            context: apps/siteconsole
            dockerfile: Dockerfile
            version_file: chart/siteconsole/Chart.yaml
    steps:
      - uses: actions/checkout@v4

      - name: Resolve build strategy
        id: strategy
        working-directory: ${{ matrix.context }}
        run: |
          set -euo pipefail
          if [ -f "${{ matrix.dockerfile }}" ] || [ -f Dockerfile ]; then
            echo "mode=dockerfile" >> "$GITHUB_OUTPUT"
            if [ -f "${{ matrix.dockerfile }}" ]; then
              echo "dockerfile=${{ matrix.dockerfile }}" >> "$GITHUB_OUTPUT"
            else
              echo "dockerfile=Dockerfile" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "mode=nixpacks" >> "$GITHUB_OUTPUT"
            echo "dockerfile=" >> "$GITHUB_OUTPUT"
          fi

      - name: Version
        id: meta
        run: |
          V=$(awk '/^version:/{print $2; exit}' "${{ matrix.version_file }}")
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (Dockerfile)
        if: steps.strategy.outputs.mode == 'dockerfile'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ steps.strategy.outputs.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/wooj-commits/${{ matrix.name }}:${{ steps.meta.outputs.version }}
            ghcr.io/wooj-commits/${{ matrix.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/wooj-commits/olares-site-platform
            org.opencontainers.image.licenses=Apache-2.0

      - name: Install Nixpacks
        if: steps.strategy.outputs.mode == 'nixpacks'
        run: curl -sSL https://nixpacks.com/install.sh | bash

      - name: Build and push (Nixpacks)
        if: steps.strategy.outputs.mode == 'nixpacks'
        env:
          NIXPACKS_IMAGE: ghcr.io/wooj-commits/${{ matrix.name }}:${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          nixpacks build "${{ matrix.context }}" --name "$NIXPACKS_IMAGE"
          docker tag "$NIXPACKS_IMAGE" "ghcr.io/wooj-commits/${{ matrix.name }}:latest"
          docker push "$NIXPACKS_IMAGE"
          docker push "ghcr.io/wooj-commits/${{ matrix.name }}:latest"

      - name: Fallback Buildpacks (if Nixpacks unavailable)
        if: steps.strategy.outputs.mode == 'nixpacks' && failure()
        env:
          BP_IMAGE: ghcr.io/wooj-commits/${{ matrix.name }}:${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          (curl -sSL "https://github.com/buildpacks/pack/releases/download/v0.36.4/pack-v0.36.4-linux.tgz" | sudo tar -C /usr/local/bin -xz pack) || true
          pack build "$BP_IMAGE" --path "${{ matrix.context }}" --builder paketobuildpacks/builder-jammy-base --publish
          docker pull "$BP_IMAGE"
          docker tag "$BP_IMAGE" "ghcr.io/wooj-commits/${{ matrix.name }}:latest"
          docker push "ghcr.io/wooj-commits/${{ matrix.name }}:latest"

      - name: Make package public
        continue-on-error: true
        run: |
          curl -sS -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/user/packages/container/${{ matrix.name }}" \
            -d '{"visibility":"public"}' || true

  package-charts:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v4

      - name: Validate chart resources vs OlaresManifest
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml
          python3 scripts/validate-olares-resources.py chart/olaresdemo
          python3 scripts/validate-olares-resources.py chart/fastapihello
          python3 scripts/validate-olares-resources.py chart/siteconsole

      - name: Version
        id: meta
        run: |
          # Platform release tag tracks olaresdemo; siteconsole also attached
          V=$(awk '/^version:/{print $2; exit}' chart/olaresdemo/Chart.yaml)
          SC=$(awk '/^version:/{print $2; exit}' chart/siteconsole/Chart.yaml)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "siteconsole=$SC" >> "$GITHUB_OUTPUT"

      - name: Install helm
        uses: azure/setup-helm@v4

      - name: Package charts
        run: |
          mkdir -p dist
          helm package chart/olaresdemo -d dist
          helm package chart/fastapihello -d dist
          helm package chart/siteconsole -d dist
          ls -la dist

      - name: Upload chart artifacts
        uses: actions/upload-artifact@v4
        with:
          name: olares-charts
          path: dist/*.tgz

      - name: Release chart tarballs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: v${{ steps.meta.outputs.version }}
          files: dist/*.tgz
          generate_release_notes: true
          body: |
            Includes siteconsole-${{ steps.meta.outputs.siteconsole }}.tgz (Site Console).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
